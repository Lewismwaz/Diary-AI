
appId: com.diaryai.desktop
productName: Diary AI
copyright: "Copyright © 2026 Yavotu"

# Keep filesystem-dependent runtime files unpacked while troubleshooting.
asar: false
npmRebuild: true

directories:
  output: release
  buildResources: build

files:
  - dist/electron/main.js
  - package.json
  - next.config.ts
  - prisma.config.ts
  - prisma/schema.prisma
  - prisma/migrations/**/*
  - generated/prisma/**/*
  - .next/standalone/**/*
  - node_modules/prisma/**/*
  - node_modules/@prisma/**/*
  - node_modules/embedded-postgres/**/*
  - node_modules/@embedded-postgres/**/*
  - node_modules/dotenv/**/*
  - "!**/*.map"
  - "!**/README*"
  - "!**/CHANGELOG*"
  - "!**/LICENSE*"
  - "!**/test/**"
  - "!**/tests/**"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: Diary-AI
  artifactName: "Diary-AI-Setup-${version}-${arch}.${ext}"
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Diary AI
  deleteAppDataOnUninstall: false
  runAfterFinish: true
